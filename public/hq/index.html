<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E1411">
<title>HQ · Rent Coat Co.</title>
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Archivo";font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url("/fonts/archivo-variable-latin.woff2") format("woff2")}
@font-face{font-family:"Mono";font-weight:500;font-display:swap;src:url("/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2")}
:root{
  --bg:#0E1411;--panel:#151D19;--panel-2:#1B2520;--line:#26322C;--line-2:#34433B;
  --ink:#F1EEE6;--text:#B9C2BC;--mute:#7E8A83;--gold:#C9A45C;--gold-2:#E3C27E;--red:#C24A39;--green:#5DB287;--blue:#7FA7D9;
  --r:14px;--r-lg:20px;--ease:cubic-bezier(.2,.7,.2,1);
  --display:"Archivo",system-ui,sans-serif;--body:"Archivo",system-ui,sans-serif;--mono:"Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--gold-2)}
.hide{display:none!important}
/* layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,#121A16,#0E1411)}
.brand{display:flex;align-items:center;gap:10px;font:800 17px/1 var(--display);letter-spacing:.02em;margin:0 8px 26px}
.brand svg{width:22px;height:22px}
.brand small{display:block;font:500 10px/1 var(--mono);letter-spacing:.18em;color:var(--gold);margin-top:5px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:0;background:transparent;color:var(--text);cursor:pointer;text-align:left;font-weight:600;transition:background .2s var(--ease),color .2s}
.nav svg{width:19px;height:19px;flex:none;opacity:.85}
.nav:hover{background:var(--panel);color:var(--ink)}
.nav[aria-current="page"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.nav .badge{margin-left:auto}
.side .foot{margin-top:auto;font:500 11px/1.4 var(--mono);color:var(--mute);padding:0 10px}
main{padding:34px 40px 120px;max-width:1180px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
h1{font:800 34px/1.05 var(--display);letter-spacing:-.02em;margin:0}
h1 em{font-style:normal;color:var(--gold)}
h2{font:700 18px/1.2 var(--display);margin:0 0 14px}
.sub{color:var(--text);margin:6px 0 0}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 7px;border-radius:99px;background:var(--red);color:#fff;font:700 11px/1 var(--body)}
.badge.gold{background:var(--gold);color:#1a1408}
/* cards */
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.stat .k{display:flex;justify-content:space-between;align-items:center}
.stat .v{font:800 34px/1 var(--display);letter-spacing:-.02em;margin:14px 0 6px}
.stat .s{color:var(--text);font-size:13.5px}
.stat .s b{color:var(--green);font-weight:700}
.alert{display:flex;gap:16px;align-items:center;justify-content:space-between;border-color:#5a3a2a;background:linear-gradient(135deg,#2a1c16,#1a1512)}
.alert.ok{border-color:#28503d;background:linear-gradient(135deg,#14261d,#121c17)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel-2);cursor:pointer;font-weight:650;transition:transform .15s var(--ease),background .2s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:#4a5c52}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#17120a}
.btn.primary:hover{background:var(--gold-2)}
.btn.green{background:#1f4a35;border-color:#2c6a4b;color:#d9f5e6}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px}
.tabs button{border:0;background:transparent;color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:650}
.tabs button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.countdown{font:500 12px/1 var(--mono);letter-spacing:.08em;color:var(--gold);background:#1e1a10;border:1px solid #4a3d1f;padding:9px 12px;border-radius:99px}
/* orders */
.order{display:grid;grid-template-columns:1fr auto;gap:12px 20px}
.order .who{font-weight:750;font-size:16px}
.order .meta{color:var(--mute);font:500 12px/1.4 var(--mono)}
.items{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:flex;align-items:center;gap:12px}
.item img{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--panel-2)}
.pill{display:inline-block;font:600 11px/1 var(--mono);letter-spacing:.06em;padding:5px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--text)}
.pill.tap{color:var(--gold-2);border-color:#5a4a26;background:#201b10}
.pill.auto{color:#a7d9bf;border-color:#2c5a43;background:#12241b}
.pill.done{color:#a7d9bf;border-color:#2c5a43}
.addr{font:500 13px/1.5 var(--mono);color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;white-space:pre-line}
.money{text-align:right}
.money .t{font:800 22px/1 var(--display)}
.money .k{color:var(--green);font-size:13px;margin-top:6px}
/* posts */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.post{padding:0;overflow:hidden;display:flex;flex-direction:column}
.post video{width:100%;aspect-ratio:9/16;max-height:420px;object-fit:cover;background:#000;display:block}
.post .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.post textarea{width:100%;min-height:96px;resize:vertical;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);line-height:1.45}
.post .title{font-weight:750}
.acct{font:600 11px/1 var(--mono);color:var(--gold)}
.acct.mission{color:#9ec5ff}
.acctbar{display:flex;gap:8px;margin:0 0 16px}
.acctbar button{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:transparent;color:inherit;font:600 14px/1.2 inherit;cursor:pointer}
.acctbar button[aria-pressed="true"]{background:rgba(255,255,255,.1);border-color:currentColor}
.acctbar small{display:block;font-weight:400;opacity:.65;margin-top:3px}
.field{width:100%;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:11px 13px;color:var(--ink);line-height:1.45}
.field::placeholder{color:var(--mute)}
.field:focus{outline:none;border-color:var(--gold)}
select.field{appearance:none}
select.field option{background:var(--panel);color:var(--ink)}
#composer summary{list-style:none}
.mo-av{width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#1a1408;font:800 15px/1 var(--body)}
.mo-row{display:flex;gap:10px;align-items:flex-end}
.mo-did{align-self:flex-start;font:600 12px/1.3 var(--mono);color:var(--green);background:rgba(93,178,135,.08);border:1px solid rgba(93,178,135,.25);border-radius:10px;padding:7px 10px}
.plat{font:600 11px/1 var(--mono);color:var(--green);margin-left:6px}
#composer .lbl{font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.views{width:92px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100dvh - 190px);min-height:420px}
.log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 16px}
.msg{max-width:82%;padding:12px 15px;border-radius:18px;white-space:pre-wrap;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--gold);color:#17120a;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
.compose{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line-2);border-radius:18px;padding:8px}
.compose textarea{flex:1;border:0;background:transparent;resize:none;outline:none;padding:8px 10px;min-height:44px;max-height:160px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line-2);background:transparent;color:var(--text);border-radius:99px;padding:7px 12px;cursor:pointer;font-size:13.5px}
.chip:hover{color:var(--ink);border-color:#4a5c52}
/* products */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.prod{padding:0;overflow:hidden}
.prod img{width:100%;aspect-ratio:1;object-fit:cover;background:#f2efe8;display:block}
.prod .b{padding:12px 14px}
/* setup */
.check{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.dot{width:22px;height:22px;border-radius:99px;flex:none;display:grid;place-items:center;border:1.5px solid var(--line-2);margin-top:2px}
.dot.on{background:var(--green);border-color:var(--green)}
.dot.on::after{content:"";width:9px;height:5px;border:2px solid #0e1411;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check ol{margin:8px 0 0;padding-left:18px;color:var(--text)}
code{font:500 12.5px var(--mono);background:var(--panel-2);border:1px solid var(--line);padding:2px 6px;border-radius:6px;color:var(--gold-2)}
/* skeletons */
.sk{position:relative;overflow:hidden;background:var(--panel-2);border-radius:10px}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.06) 50%,transparent 80%);transform:translateX(-100%);animation:sheen 1.3s ease-in-out infinite}
@keyframes sheen{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none}}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#22302a;border:1px solid var(--line-2);color:var(--ink);padding:11px 16px;border-radius:12px;font-weight:600;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.35)}
/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.login input{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:13px 14px}
/* phone */
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:22px 16px calc(110px + env(safe-area-inset-bottom))}
  h1{font-size:28px}
  .g3,.g2{grid-template-columns:1fr}
  .stat .v{font-size:30px}
  .tabbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;background:rgba(21,29,25,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line-2);border-radius:20px;padding:6px;justify-content:space-between}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--mute);font:600 10.5px/1 var(--body);padding:8px 0;border-radius:14px;position:relative}
  .tabbar svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--ink);background:var(--panel-2)}
  .tabbar .badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:16px;height:16px;font-size:9.5px;padding:0 4px}
  .order{grid-template-columns:1fr}
  .money{text-align:left}
  .chat{height:calc(100dvh - 230px)}
  .msg{max-width:90%}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-today" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></symbol>
  <symbol id="i-orders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></symbol>
  <symbol id="i-posts" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M10 9l5 3-5 3z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-products" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l4 2 4-2 4 3-2 4h-2v9H8v-9H6L4 7z"/></symbol>
  <symbol id="i-grow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
  <symbol id="i-setup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><rect x="4" y="2" width="2.2" height="20" rx="1" fill="#C9A45C"/><path d="M6.5 3.5H20l-2.5 3.4L20 10.5H6.5z" fill="#C24A39"/></symbol>
</svg>

<div class="login" id="login">
  <form id="login-form">
    <div class="brand" style="margin:0 0 8px"><svg><use href="#i-flag"/></svg><div>RENT COAT HQ<small>BACK OFFICE</small></div></div>
    <h1 style="font-size:28px">Welcome back.</h1>
    <p class="sub" style="margin-top:-4px">Enter your admin key. It stays on this device.</p>
    <input id="key" type="password" autocomplete="current-password" placeholder="Admin key" required>
    <button class="btn primary" type="submit">Open HQ</button>
    <p class="sub" id="login-note" style="font-size:13px"></p>
  </form>
</div>

<div class="app hide" id="app">
  <aside class="side">
    <div class="brand"><svg><use href="#i-flag"/></svg><div>RENT COAT HQ<small>BACK OFFICE</small></div></div>
    <nav id="nav"></nav>
    <div class="foot">rentcoat.co<br><a href="/" target="_blank" rel="noopener">Open the store ↗</a></div>
  </aside>
  <main id="main"></main>
</div>
<nav class="tabbar hide" id="tabbar"></nav>
<div class="toast hide" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const money = c => "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
let KEY = store.get("hq-key");
const TABS = [["today", "Today", "i-today"], ["orders", "Orders", "i-orders"], ["posts", "Posts", "i-posts"], ["grow", "Grow", "i-grow"], ["chat", "Mo", "i-chat"], ["products", "Products", "i-products"], ["setup", "Setup", "i-setup"]];
const ACCT = { rentcoat: "@rentcoat.co", mission: "@whatisanldsmission" };
let state = { tab: "today", overview: null, orders: null, queue: null, products: null, postFilter: "review", acct: store.get("hq-acct") || "mission", orderFilter: "place", draft: { mode: "ai", fmt: "feed", img: "", caption: "", busy: false }, chat: JSON.parse(store.get("hq-chat") || "[]"), mo: JSON.parse(store.get("hq-mo") || "[]") };

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add("hide"), 2200); }
async function api(path, opts = {}) {
  const res = await fetch("/api/hq/" + path, { ...opts, headers: { "x-hq-key": KEY, ...(opts.body ? { "Content-Type": "application/json" } : {}) }, cache: "no-store" });
  if (res.status === 404 && path === "overview") throw Object.assign(new Error("bad key"), { auth: true });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}
const local = u => String(u || "").replace(/^https:\/\/rentcoat\.co/, ""); // play from whichever site HQ is open on
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body || {}) });

function navHtml(mobile) {
  const badges = { orders: state.overview?.toPlace || 0, posts: state.overview?.queue?.review || 0 };
  return TABS.filter(([id]) => !mobile || id !== "products").map(([id, label, icon]) =>
    `<button class="${mobile ? "" : "nav"}" data-tab="${id}" ${state.tab === id ? 'aria-current="page"' : ""}><svg><use href="#${icon}"/></svg>${label}${badges[id] ? `<span class="badge${id === "posts" ? " gold" : ""}">${badges[id]}</span>` : ""}</button>`).join("");
}
function paintNav() {
  $("#nav").innerHTML = navHtml(false); $("#tabbar").innerHTML = navHtml(true);
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => go(b.dataset.tab));
}
function go(tab) { state.tab = tab; location.hash = tab; paintNav(); render(); window.scrollTo({ top: 0 }); }

const sk = (h, w = "100%") => `<div class="sk" style="height:${h}px;width:${w}"></div>`;
function countdown() {
  const ms = new Date(state.overview?.opens || "2026-11-27T10:00:00-05:00") - Date.now();
  if (ms <= 0) return "STORE IS OPEN";
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24;
  return `OPENS IN ${d}D ${h}H`;
}

// ---------- views ----------
function viewToday() {
  const o = state.overview;
  const hour = new Date().getHours(), hi = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  const stat = (label, x) => o ? `<div class="card stat"><div class="k"><span class="eyebrow">${label}</span></div><div class="v">${money(x.sales)}</div><div class="s">${x.orders} order${x.orders === 1 ? "" : "s"} · you keep about <b>${money(Math.max(0, x.keep))}</b></div></div>`
    : `<div class="card">${sk(12, "40%")}<div style="height:16px"></div>${sk(34, "60%")}<div style="height:10px"></div>${sk(12, "70%")}</div>`;
  return `<div class="head"><div><span class="eyebrow">Today</span><h1>${hi}, <em>Eli</em>.</h1><p class="sub">Here's the business at a glance.</p></div><span class="countdown">${countdown()}</span></div>
  ${o ? (() => { const goal = 1000000, got = o.month.sales, aov = o.month.orders ? got / o.month.orders : 5500, left = Math.max(0, goal - got), per = Math.ceil(left / aov / 30);
    return `<div class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="eyebrow">Goal · $10k a month</span><span class="sub" style="margin:0">${money(got)} in the last 30 days</span></div>
    <div style="height:10px;background:var(--panel-2);border-radius:99px;margin:12px 0;overflow:hidden"><div style="height:100%;width:${Math.min(100, got / goal * 100).toFixed(1)}%;background:linear-gradient(90deg,var(--gold),var(--gold-2))"></div></div>
    <p class="sub" style="margin:0">${left ? `About <b>${per} order${per === 1 ? "" : "s"} a day</b> at a ${money(Math.round(aov))} average order gets you there. Ask Mo for today's plan.` : "Goal hit. Keep going."}</p></div>`; })() : ""}
  <div class="grid g3">${o ? [stat("Today", o.today), stat("Last 7 days", o.week), stat("Last 30 days", o.month)].join("") : stat().repeat(3)}</div>
  <div class="grid g2" style="margin-top:16px">

const FMT = { feed: [1080, 1350], story: [1080, 1920], square: [1080, 1080] };
async function loadImg(src) { const im = new Image(); im.src = src; await im.decode(); return im; }
function drawFrame(g, W, H, im, head, zoom = 1, alpha = 1) {
  const band = H - W > 300 ? 300 : 240, box = H - band;
  g.globalAlpha = 1; g.fillStyle = "#13201a"; g.fillRect(0, 0, W, H);
  g.globalAlpha = alpha;
  const s0 = Math.max(W / im.width, box / im.height) * zoom, w = im.width * s0, h = im.height * s0;
  g.save(); g.beginPath(); g.rect(0, 0, W, box); g.clip(); g.drawImage(im, (W - w) / 2, (box - h) / 2, w, h); g.restore();
  g.globalAlpha = 1; g.fillStyle = "#f3eee1"; g.font = '800 72px "Archivo", system-ui, sans-serif'; g.textBaseline = "top";
  const words = String(head || "").toUpperCase().split(" "); let line = "", lines = [];
  for (const w2 of words) { const t = line ? line + " " + w2 : w2; if (g.measureText(t).width > W - 100 && line) { lines.push(line); line = w2; } else line = t; }
  lines.push(line); lines.slice(0, 2).forEach((l, i) => g.fillText(l, 50, box + 30 + i * 80));
  g.fillStyle = "#c9a45c"; g.font = '500 30px "Mono", monospace'; g.fillText("RENTCOAT.CO", 50, H - 60);
}
async function productImage(prod, head, fmt = "feed") {
  const [W, H] = FMT[fmt]; const c = document.createElement("canvas"); c.width = W; c.height = H;
  await document.fonts.load('800 72px "Archivo"');
  drawFrame(c.getContext("2d"), W, H, await loadImg("/" + prod.images[0].src), head || prod.name);
  return c.toDataURL("image/jpeg", 0.9);
}
// An 8-second ad recorded in the browser: slow zoom on each product photo with a crossfade, headline and site.
async function productVideo(prod, head, fmt = "story") {
  const [W, H] = FMT[fmt]; const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
  await document.fonts.load('800 72px "Archivo"');
  const ims = await Promise.all(prod.images.slice(0, 3).map(i => loadImg("/" + i.src)));
  const type = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!type) throw new Error("This browser can't record video. Try Chrome or Safari.");
  const rec = new MediaRecorder(c.captureStream(30), { mimeType: type, videoBitsPerSecond: 2500000 }), parts = [];
  rec.ondataavailable = e => e.data.size && parts.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  const T = 8000, per = T / ims.length, t0 = performance.now();
  drawFrame(g, W, H, ims[0], head || prod.name); rec.start(250);
  await new Promise(res => { const tick = () => { const t = performance.now() - t0; if (t >= T) return res();
    const i = Math.min(ims.length - 1, Math.floor(t / per)), k = (t - i * per) / per;
    drawFrame(g, W, H, ims[i], head || prod.name, 1 + 0.08 * k);
    if (i + 1 < ims.length && k > 0.85) drawFrame(g, W, H, ims[i + 1], head || prod.name, 1, (k - 0.85) / 0.15);
    requestAnimationFrame(tick); }; tick(); });
  rec.stop(); await done;
  const blob = new Blob(parts, { type: type.split(";")[0] });
  return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
}

  const o = state.overview || { connected: { instagram: {} } }, v = state.vault, set = v?.set || {}, acc = v?.accounts || {};
  if (!v) { load("vault", "vault"); return `<div class="head"><div><span class="eyebrow">Setup</span><h1>Connections</h1></div></div><div class="card">${sk(200)}</div>`; }
  const dot = on => `<span class="dot ${on ? "on" : ""}"></span>`;
  const keyRow = (k, label, ph) => `<div style="display:flex;gap:8px;align-items:center;margin-top:8px"><input class="field" type="password" autocomplete="off" data-key="${k}" placeholder="${set[k] ? "Saved ✓ (paste to replace)" : ph}"><button class="btn sm" data-savekey="${k}">Save</button></div><span class="sub" style="font-size:12px">${label}</span>`;
  const open = (href, text) => `<a class="btn sm" href="${href}" target="_blank" rel="noopener">${text} ↗</a>`;
  const svc = (on, name, what, body) => `<div class="card" style="margin-bottom:12px"><div style="display:flex;gap:12px;align-items:flex-start">${dot(on)}<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b style="font-size:17px">${name}</b><span class="pill">${on ? "CONNECTED" : "NOT CONNECTED"}</span></div><p class="sub" style="margin:4px 0 10px">${what}</p>${body}</div></div></div>`;
  const metaOn = Boolean(acc.meta), ttOn = Boolean(acc.tiktok);
  return `<div class="head"><div><span class="eyebrow">Setup</span><h1>Connections</h1><p class="sub">Tap a button, log in, come back. Keys you paste here are saved privately in HQ, never shown again.</p></div></div>
  ${svc(set.ANTHROPIC_API_KEY, "Mo (Claude)", "Mo, captions, hashtags and post planning. About $3–15 a month at your volume (estimate).",
    `${open("https://console.anthropic.com/settings/keys", "Get a key")}${keyRow("ANTHROPIC_API_KEY", "Create key → copy → paste here → Save.", "sk-ant-…")}`)}
  ${svc(set.CF_AI_TOKEN && set.CF_ACCOUNT_ID, "Image maker (Cloudflare)", "AI images. Free daily allowance.",
    `${open("https://dash.cloudflare.com/profile/api-tokens", "Get a token")}${keyRow("CF_AI_TOKEN", "Create token → template “Workers AI” → copy → paste.", "API token")}${keyRow("CF_ACCOUNT_ID", "Account ID: right side of the Cloudflare home page.", "Account ID")}`)}
  ${svc(metaOn, "Instagram + Facebook + Meta ads", metaOn ? `Linked: ${esc([...(acc.meta.instagram || []), acc.meta.page && "Page: " + acc.meta.page, acc.meta.adAccount && "Ads: " + acc.meta.adAccount].filter(Boolean).join(" · ") || "no Instagram business accounts found")}` : "One login connects both Instagram accounts, the Rent Coat Facebook Page and ad stats.",
    `${set.META_APP_ID && set.META_APP_SECRET ? "" : `<p class="sub" style="margin:0 0 6px"><b>Step 1, once:</b> ${open("https://developers.facebook.com/apps/creation/", "Create a Meta app")} type “Business”. Add <b>Facebook Login for Business</b>, and under its settings paste this as a Valid OAuth Redirect URI:</p><div style="display:flex;gap:8px"><input class="field" readonly value="${esc(v.redirects.meta)}"><button class="btn sm" data-copy="${esc(v.redirects.meta)}">Copy</button></div><p class="sub" style="margin:8px 0 0">Then App settings → Basic: copy the App ID and App Secret here.</p>${keyRow("META_APP_ID", "App ID", "App ID")}${keyRow("META_APP_SECRET", "App Secret", "App Secret")}<p class="sub" style="margin:10px 0 6px"><b>Step 2:</b></p>`}
     <div class="row"><button class="btn primary" data-connect="meta">${metaOn ? "Reconnect" : "Connect Instagram & Facebook"}</button>${metaOn ? `<button class="btn sm ghost" data-disconnect="meta">Disconnect</button>` : ""}</div>
     <p class="sub" style="font-size:12px;margin-top:8px">Both Instagram accounts must be Professional and linked to a Facebook Page. Ads stats need reconnecting every ~60 days.</p>`)}
  ${svc(ttOn, "TikTok", "Sends Rent Coat posts to your TikTok drafts; you add a sound and post in the app.",
    `${set.TIKTOK_CLIENT_KEY && set.TIKTOK_CLIENT_SECRET ? "" : `<p class="sub" style="margin:0 0 6px"><b>Step 1, once:</b> ${open("https://developers.tiktok.com/apps/", "Create a TikTok app")} add <b>Login Kit</b> and <b>Content Posting API</b>, set this as the Redirect URI:</p><div style="display:flex;gap:8px"><input class="field" readonly value="${esc(v.redirects.tiktok)}"><button class="btn sm" data-copy="${esc(v.redirects.tiktok)}">Copy</button></div>${keyRow("TIKTOK_CLIENT_KEY", "Client key", "Client key")}${keyRow("TIKTOK_CLIENT_SECRET", "Client secret", "Client secret")}<p class="sub" style="margin:10px 0 6px"><b>Step 2:</b></p>`}
     <div class="row"><button class="btn primary" data-connect="tiktok">${ttOn ? "Reconnect" : "Connect TikTok"}</button>${ttOn ? `<button class="btn sm ghost" data-disconnect="tiktok">Disconnect</button>` : ""}</div>`)}
  ${svc(set.RESEND_API_KEY, "Email (Resend)", "Launch emails, abandoned-checkout reminders, review requests, referral codes. Free up to 100 emails a day, 3,000 a month.",
    `${open("https://resend.com/domains", "Add rentcoat.co in Resend")}<p class="sub" style="font-size:12px;margin:6px 0">Add the domain, then add the DNS records Resend shows wherever rentcoat.co's DNS lives. Then API Keys → Create → paste.</p>${keyRow("RESEND_API_KEY", "Resend API key", "re_…")}${keyRow("EMAIL_FROM", "From, e.g. Rent Coat Co. &lt;hello@rentcoat.co&gt;", "Rent Coat Co. <hello@rentcoat.co>")}${keyRow("MAIL_ADDRESS", "Mailing address for marketing emails (required by law; a PO box works).", "PO Box …, Holly Springs, NC")}`)}
  ${svc(set.NETLIFY_TOKEN, "Reminder list (Netlify)", "Lets HQ read the emails people left for the launch reminder.",
    `${open("https://app.netlify.com/user/applications#personal-access-tokens", "Make a token")}${keyRow("NETLIFY_TOKEN", "New access token → copy → paste.", "Netlify token")}`)}
  ${svc(set.FAL_KEY, "AI video (fal.ai)", "Turns any image into a 5-second AI video ad (Kling 2.5). About $0.35 a clip; HQ stops at your monthly cap.",
    `${open("https://fal.ai/dashboard/keys", "Get a key")}<p class="sub" style="font-size:12px;margin:6px 0">Add a few dollars of credit at fal.ai first; it's pay as you go.</p>${keyRow("FAL_KEY", "fal API key", "key")}${keyRow("FAL_MONTHLY_CAP", "Monthly cap in dollars (default 10)", "10")}`)}
  ${svc(true, "Store, checkout and orders", "Stripe and the order list are connected. Tapstitch orders are placed by hand from Orders; Printful handles only the dad cap.", `${open("https://dashboard.stripe.com/settings/communication-preferences", "Turn on order emails")}<p class="sub" style="font-size:12px;margin-top:6px">Turn on “Successful payments” so every order reaches your inbox too.</p>`)}
  <div class="row" style="margin-top:16px"><button class="btn ghost" id="logout">Sign out of HQ on this device</button></div>`;
}

const VIEWS = { grow: viewGrow, today: viewToday, orders: viewOrders, posts: viewPosts, chat: viewChat, products: viewProducts, setup: viewSetup };
function render() {
  $("#main").innerHTML = VIEWS[state.tab]();
  wire();
  if (state.tab === "orders" && !state.orders) load("orders", "orders?days=30");
  if (state.tab === "posts" && !state.queue) load("queue", "queue");
  if (state.tab === "products" && !state.products) load("products", "products");
  if (state.tab === "chat") { const l = $("#log"); l.scrollTop = l.scrollHeight; }
}
async function load(slot, path) { try { state[slot] = await api(path); render(); } catch (e) { toast(e.message); } }

function wire() {
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll("[data-of]").forEach(b => b.onclick = () => { state.orderFilter = b.dataset.of; render(); });
  document.querySelectorAll("[data-acct]").forEach(b => b.onclick = () => { state.acct = b.dataset.acct; store.set("hq-acct", b.dataset.acct); render(); });
  const cmp = $("#composer"); if (cmp) cmp.ontoggle = () => { state.draft.open = cmp.open; if (cmp.open && !state.products) load("products", "products"); };
  document.querySelectorAll("[data-fmt]").forEach(b => b.onclick = () => { state.draft.fmt = b.dataset.fmt; state.draft.open = true; render(); });
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { state.draft.mode = b.dataset.mode; if (b.dataset.mode === "video" && state.draft.fmt === "feed") state.draft.fmt = "story"; state.draft.open = true; if (!state.products) load("products", "products"); render(); });
  const keep = () => { const d = state.draft; d.motion = $("#d-motion")?.value ?? d.motion; d.idea = $("#d-idea")?.value ?? d.idea; d.prompt = $("#d-prompt")?.value ?? d.prompt; d.caption = $("#d-cap")?.value ?? d.caption; d.head = $("#d-head")?.value ?? d.head; d.prod = $("#d-prod")?.value ?? d.prod; d.open = true; };
  if ($("#d-claude")) $("#d-claude").onclick = async () => { keep(); const d = state.draft, ai = d.mode === "ai" || state.acct === "mission"; d.busy = true; render();
    try {
      if (!ai && !state.products) state.products = await api("products");
      const prod = ai ? null : (state.products.products.find(x => x.id === d.prod) || state.products.products[0]);
      const plan = await post("draft", { account: state.acct, idea: d.idea, product: prod?.id });
      d.prompt = plan.imagePrompt || d.prompt; d.head = plan.headline || d.head; d.caption = plan.caption || d.caption; if (prod) d.prod = prod.id;
      d.img = ai ? (await post("image", { prompt: d.prompt })).url : (await post("upload", { image: d.mode === "video" ? await productVideo(prod, d.head, d.fmt) : await productImage(prod, d.head, d.fmt) })).url;
    } catch (e) { toast(e.message); }
    d.busy = false; render(); };
  if ($("#d-gen")) $("#d-gen").onclick = async () => { keep(); state.draft.busy = true; render();
    try { state.draft.img = (await post("image", { prompt: state.draft.prompt })).url; } catch (e) { toast(e.message); } state.draft.busy = false; render(); };
  if ($("#d-render")) $("#d-render").onclick = async () => { keep(); const prod = (state.products?.products || []).find(x => x.id === state.draft.prod) || state.products?.products?.[0]; if (!prod) return toast("Products still loading.");
    state.draft.busy = true; render();
    try { const d = state.draft; d.img = (await post("upload", { image: d.mode === "video" ? await productVideo(prod, d.head, d.fmt) : await productImage(prod, d.head, d.fmt) })).url; } catch (e) { toast(e.message); }
    state.draft.busy = false; render(); };
  if ($("#d-add")) $("#d-add").onclick = async () => { keep(); const d = state.draft;
    try { const r = await post("queue", { account: state.acct, title: (d.head || d.prompt || "New post").slice(0, 80), caption: d.caption, media: [d.img] });
      state.queue.queue.unshift(r.post); state.draft = { mode: d.mode, img: "", caption: "", busy: false }; state.postFilter = "review"; state.overview = await api("overview"); paintNav(); render(); toast("Added to review"); } catch (e) { toast(e.message); } };
  document.querySelectorAll("[data-pf]").forEach(b => b.onclick = () => { state.postFilter = b.dataset.pf; render(); });
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.copy).then(() => toast("Copied")));
  document.querySelectorAll("[data-placed]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await post(`orders/${b.dataset.placed}/placed`, { placed: b.dataset.on === "1" }); state.orders = null; state.overview = await api("overview"); paintNav(); render(); toast(b.dataset.on === "1" ? "Marked placed" : "Undone"); }
    catch (e) { toast(e.message); b.disabled = false; }
  });
  const findPost = id => state.queue.queue.find(p => p.id === id);
  const updated = p => { const q = state.queue.queue; q[q.findIndex(x => x.id === p.id)] = p; };
  document.querySelectorAll("[data-caption]").forEach(t => t.onchange = async () => { try { updated((await post(`queue/${t.dataset.caption}`, { caption: t.value })).post); toast("Caption saved"); } catch (e) { toast(e.message); } });
  document.querySelectorAll("[data-copycap]").forEach(b => b.onclick = () => navigator.clipboard.writeText(findPost(b.dataset.copycap).caption).then(() => toast("Caption copied")));
  document.querySelectorAll("[data-status]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { updated((await post(`queue/${b.dataset.status}`, { status: b.dataset.to })).post); state.overview = await api("overview"); paintNav(); render(); toast(b.dataset.to === "approved" ? "Approved" : "Marked posted"); }
    catch (e) { toast(e.message); b.disabled = false; }
  });
  document.querySelectorAll("[data-publish]").forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = "Posting…";
    try {
      let p = (await post(`queue/${b.dataset.publish}/publish`)).post;
      for (let i = 0; i < 20 && p.status === "publishing"; i++) { await new Promise(r => setTimeout(r, 4000)); p = (await post(`queue/${p.id}/publish`)).post; }
      updated(p); render(); toast(p.status === "posted" ? "Posted to Instagram" : "Instagram is still processing. Tap Finish posting in a minute.");
    } catch (e) { toast(e.message); render(); }
  });
  document.querySelectorAll("[data-plat]").forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = "Sending…";
    try { updated((await post(`queue/${b.dataset.id}/${b.dataset.plat}`)).post); render(); toast(b.dataset.plat === "facebook" ? "Posted to Facebook" : "Sent to your TikTok drafts: finish it in the app"); }
    catch (e) { toast(e.message); render(); }
  });
  document.querySelectorAll("[data-mkimg]").forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = "Making…"; const p = findPost(b.dataset.mkimg);
    try { const u = (await post("image", { prompt: p.prompt || p.title })).url; updated((await post(`queue/${p.id}`, { media: [u] })).post); render(); }
    catch (e) { toast(e.message); render(); }
  });
  document.querySelectorAll("[data-views]").forEach(i => i.onchange = async () => { try { updated((await post(`queue/${i.dataset.views}`, { views: Number(i.value) })).post); toast("Saved"); } catch (e) { toast(e.message); } });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove this post from the queue?")) return;
    try { await post(`queue/${b.dataset.del}`, { delete: true }); state.queue.queue = state.queue.queue.filter(p => p.id !== b.dataset.del); render(); } catch (e) { toast(e.message); }
  });
  const say = $("#say");
  if (say) {
    say.oninput = () => { say.style.height = "auto"; say.style.height = Math.min(160, say.scrollHeight) + "px"; };
    say.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#compose").requestSubmit(); } };
    document.querySelectorAll("[data-chip]").forEach(c => c.onclick = () => { say.value = c.dataset.chip; $("#compose").requestSubmit(); });
    $("#compose").onsubmit = async e => {
      e.preventDefault(); const text = say.value.trim(); if (!text || state.moBusy) return;
      state.mo.push({ role: "user", content: text }); state.moBusy = true; render();
      try {
        for (let i = 0; i < 5; i++) { const r = await post("mo", { messages: state.mo }); state.mo = r.messages; render(); if (r.done) break; }
        if (state.mo.some(m => m.role === "assistant" && Array.isArray(m.content) && m.content.some(b => b.name === "draft_post"))) { state.queue = null; state.overview = await api("overview"); paintNav(); }
      } catch (e2) { state.mo.push({ role: "assistant", content: e2.message }); }
      state.moBusy = false; store.set("hq-mo", JSON.stringify(state.mo.slice(-60))); render(); $("#say")?.focus();
    };
  }
  const clear = $("#clear"); if (clear) clear.onclick = () => { state.mo = []; store.del("hq-mo"); render(); };
  document.querySelectorAll("[data-savekey]").forEach(b => b.onclick = async () => {
    const k = b.dataset.savekey, val = document.querySelector(`[data-key="${k}"]`).value.trim(); if (!val) return toast("Paste it first.");
    b.disabled = true; try { state.vault = await post("vault", { [k]: val }); state.overview = await api("overview"); render(); toast("Saved"); } catch (e) { toast(e.message); b.disabled = false; }
  });
  document.querySelectorAll("[data-connect]").forEach(b => b.onclick = async () => { b.disabled = true; try { location.href = (await post(`connect/${b.dataset.connect}`)).url; } catch (e) { toast(e.message); b.disabled = false; } });
  document.querySelectorAll("[data-disconnect]").forEach(b => b.onclick = async () => { if (!confirm("Disconnect?")) return; try { await post(`disconnect/${b.dataset.disconnect}`); state.vault = null; state.overview = await api("overview"); render(); toast("Disconnected"); } catch (e) { toast(e.message); } });
  const keepMail = () => { if ($("#m-sub")) state.mail = { subject: $("#m-sub").value, text: $("#m-text").value }; };
  if ($("#m-test")) $("#m-test").onclick = async () => { keepMail(); try { await post("email/launch", { ...state.mail, test: true }); toast("Test sent to rentcoat.co@gmail.com"); } catch (e) { toast(e.message); } };
  if ($("#m-send")) $("#m-send").onclick = async () => { keepMail(); if (!confirm(`Send "${state.mail.subject}" to ${state.grow.list.count} people?`)) return; $("#m-send").disabled = true;
    try { const r = await post("email/launch", state.mail); toast(`Sent to ${r.sent}`); state.grow = null; render(); } catch (e) { toast(e.message); $("#m-send").disabled = false; } };
  document.querySelectorAll("[data-abmail]").forEach(b => b.onclick = async () => { b.disabled = true; try { await post(`email/abandoned/${b.dataset.abmail}`); state.grow.sent[`ab-${b.dataset.abmail}`] = Date.now(); render(); toast("Reminder sent"); } catch (e) { toast(e.message); b.disabled = false; } });
  document.querySelectorAll("[data-rvok]").forEach(b => b.onclick = async () => { try { state.grow.reviews = (await post(`reviews/${b.dataset.rvok}`, { approved: b.dataset.on === "1" })).reviews; render(); } catch (e) { toast(e.message); } });
  document.querySelectorAll("[data-rvreq]").forEach(b => b.onclick = async () => { b.disabled = true; try { await post(`orders/${b.dataset.rvreq}/review-request`); (state.grow ||= { sent: {} }).sent[`rv-${b.dataset.rvreq}`] = Date.now(); render(); toast("Review request sent"); } catch (e) { toast(e.message); b.disabled = false; } });
  document.querySelectorAll("[data-ref]").forEach(b => b.onclick = async () => { if (!confirm("Make a 10%-off code for this buyer's friends and email it to them?")) return; b.disabled = true; try { const r = await post(`orders/${b.dataset.ref}/referral`, { send: true }); (state.grow ||= { sent: {} }).sent[`ref-${b.dataset.ref}`] = Date.now(); render(); toast(`Sent code ${r.code}`); } catch (e) { toast(e.message); b.disabled = false; } });
  if ($("#d-vid")) $("#d-vid").onclick = async () => { keep(); const d = state.draft; if (!d.img || /\.(mp4|webm)$/.test(d.img)) return toast("Make an image first, then animate it.");
    if (!confirm(`Make a 5-second AI video from this image? About $${(state.grow?.video?.cost || 0.35).toFixed(2)}.`)) return;
    d.busy = true; render();
    try { const job = await post("video", { prompt: d.motion || "slow cinematic camera push in, subtle natural motion", image_url: new URL(d.img, location.origin).href });
      for (let i = 0; i < 60; i++) { await new Promise(r => setTimeout(r, 5000)); const st = await post("video/check", job); if (st.url) { d.img = st.url; break; } }
      if (!/\.mp4$/.test(d.img)) toast("Still rendering. Try again in a minute.");
    } catch (e) { toast(e.message); }
    d.busy = false; render(); };
  const out = $("#logout"); if (out) out.onclick = () => { store.del("hq-key"); location.reload(); };
}

async function start() {
  const qp = new URLSearchParams(location.search);
  if (qp.get("connected") || qp.get("error")) { setTimeout(() => toast(qp.get("error") || `${qp.get("connected") === "meta" ? "Instagram & Facebook" : "TikTok"} connected`), 600); history.replaceState(null, "", location.pathname + location.hash); }
  $("#login").classList.add("hide"); $("#app").classList.remove("hide"); $("#tabbar").classList.remove("hide");
  const fromHash = location.hash.slice(1); if (VIEWS[fromHash]) state.tab = fromHash;
  paintNav(); render();
  try { state.overview = await api("overview"); paintNav(); render(); }
  catch (e) {
    if (e.auth) { store.del("hq-key"); KEY = null; $("#app").classList.add("hide"); $("#tabbar").classList.add("hide"); $("#login").classList.remove("hide"); $("#login-note").textContent = "That key didn't work."; return; }
    toast(e.message);
  }
}
$("#login-form").onsubmit = e => { e.preventDefault(); KEY = $("#key").value.trim(); store.set("hq-key", KEY); start(); };
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (VIEWS[t] && t !== state.tab) { state.tab = t; paintNav(); render(); } });
setInterval(() => { if (state.tab === "today" && state.overview) render(); }, 60000);
if (KEY) start();
</script>
