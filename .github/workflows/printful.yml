# Creates the Fall/Winter line in Printful and commits the product photos back to this branch.
# Needs the repository secret PRINTFUL_TOKEN (Settings > Secrets and variables > Actions).
# Runs when the line's files change on the new-line branch, or by hand from the Actions tab.
name: Printful setup

on:
  push:
    branches: [new-line]
    paths: ["scripts/printful/**", "print/**", ".github/workflows/printful.yml"]
  workflow_dispatch:
    inputs:
      only:
        description: "Only these pieces (comma-separated ids), blank for all"
        required: false
      redo_photos:
        description: "Make the photos again (1 = yes)"
        required: false

permissions:
  contents: write

concurrency:
  group: printful-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create products and photos in Printful
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          # Printful downloads the print files from this exact commit.
          FILE_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/print
          ONLY: ${{ inputs.only }}
          REDO_PHOTOS: ${{ inputs.redo_photos }}
        run: node scripts/printful/setup.mjs
      - name: Commit photos and results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/images/products scripts/printful/result.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new to commit."; exit 0; fi
          git commit -m "Add Printful product photos and setup results"
          git push
      - name: Push styled photo candidates to the photo-candidates branch
        if: always() && hashFiles('candidates/**') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan photo-candidates-tmp
          git rm -rq --cached .
          git add -f candidates
          git commit -qm "Styled photo candidates from Printful"
          git push -f origin HEAD:refs/heads/photo-candidates
