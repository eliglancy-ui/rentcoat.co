# Downloads public-domain source art (Wikimedia Commons, NASA) listed in scripts/art/sources.json into art/src.
name: Fetch source art
on:
  push:
    branches: [new-line]
    paths: ["scripts/art/**", ".github/workflows/fetch-art.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/art/fetch.mjs
      - name: Commit the art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add art/src
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Add public-domain source art"
          git push
